<html>
    <head>
        <title>My Blogs - Add</title>
        <link rel="stylesheet" href="{{ url_for('static', filename= 'css/post.css') }}">
        <link rel="icon" href="{{ url_for('static', filename= 'assets/favicon.png') }}">
        
    </head>

    <body>

        <h1 id="add">Add a New Post</h1> 
        
        <form action="/addpost" method="POST"> 

            <div class="form-group"> 

                <label for="title">Title :</label> 
                <input type="text" id="title" name="title" required placeholder="Enter Post Title...">

            </div> 

            <br>

            <div class="form-group"> 

                <label for="imageurl">Image (URL) :</label> 
                <input type="url" id="image" name="image" required placeholder="Paste Image Url..."> 

            </div> 

            <br>

            <div class="form-group">

                <label for="content" id="content-css">Content :</label> 

                <textarea id="content" name="content" rows="4" required placeholder="Write Something Inspiring..."></textarea> 

            </div> 

            <br>

            <button type="submit">Add ➡️</button> 
        </form>

    </body>
</html>
